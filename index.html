<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#4f46e5">
    <title>Copy-Paste App</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='15' y='25' width='70' height='65' rx='8' fill='%234f46e5'/><rect x='25' y='35' width='50' height='45' rx='4' fill='%23818cf8'/><rect x='30' y='10' width='40' height='25' rx='6' fill='%23a855f7'/><rect x='38' y='5' width='24' height='12' rx='4' fill='%23c084fc'/><line x1='35' y1='50' x2='65' y2='50' stroke='white' stroke-width='4' stroke-linecap='round'/><line x1='35' y1='62' x2='55' y2='62' stroke='white' stroke-width='4' stroke-linecap='round'/></svg>">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            background-attachment: fixed;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        header h1 .text {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7, #f107a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Top Actions */
        .top-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .top-actions button {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.05);
            color: white;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .top-actions button:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        /* Input Section */
        .input-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group input {
            width: 140px;
            flex-shrink: 0;
        }

        .input-group select {
            width: 140px;
            flex-shrink: 0;
            padding: 12px 14px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .input-group select:focus {
            outline: none;
            border-color: #7b2ff7;
            background: rgba(255,255,255,0.08);
        }

        .input-group select option {
            background: #1a1a2e;
            color: white;
        }

        .input-group input,
        .input-group textarea {
            padding: 12px 14px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            color: white;
            transition: all 0.3s ease;
        }

        .input-group textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: #64748b;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #7b2ff7;
            background: rgba(255,255,255,0.08);
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(123, 47, 247, 0.4);
        }

        /* Table Section */
        .table-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
            color: white;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            cursor: grab;
        }

        tbody tr:active {
            cursor: grabbing;
        }

        tbody tr.dragging {
            opacity: 0.5;
            background: rgba(123, 47, 247, 0.2);
        }

        tbody tr.drag-over {
            border-top: 2px solid #7b2ff7;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.05);
        }

        tbody td {
            padding: 12px 16px;
            vertical-align: middle;
            color: #e2e8f0;
        }

        /* Label Column */
        .label-col {
            width: 140px;
        }

        .label-badge {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Content Column */
        .content-col {
            max-width: 300px;
        }

        .content-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #cbd5e1;
            font-size: 0.85rem;
        }

        /* Actions Column */
        .actions-col {
            width: 240px;
            text-align: right;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-copy {
            background: linear-gradient(135deg, #00d4ff 0%, #00a8cc 100%);
            color: white;
        }

        .btn-copy:hover {
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-edit {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1a1a2e;
        }

        .btn-edit:hover {
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4);
        }

        .btn-delete {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            color: white;
        }

        .btn-delete:hover {
            box-shadow: 0 5px 15px rgba(244, 63, 94, 0.4);
        }

        /* Empty State */
        .empty-state {
            padding: 50px 20px;
            text-align: center;
            color: #64748b;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-header {
            background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.3);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #94a3b8;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .modal-body input,
        .modal-body textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            background: rgba(255,255,255,0.05);
            color: white;
            transition: all 0.3s ease;
        }

        .modal-body input:focus,
        .modal-body textarea:focus {
            outline: none;
            border-color: #7b2ff7;
        }

        .modal-body select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            background: #1a1a2e;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .modal-body select:focus {
            outline: none;
            border-color: #7b2ff7;
        }

        .modal-body select option {
            background: #1a1a2e;
            color: white;
            padding: 10px;
        }

        .modal-footer {
            padding: 14px 20px;
            background: rgba(255,255,255,0.02);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: #94a3b8;
        }

        .btn-cancel:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-save {
            background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(123, 47, 247, 0.4);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 2000;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .input-group {
                flex-direction: column;
            }

            .input-group input {
                width: 100%;
            }

            .actions-col {
                width: auto;
            }

            thead th:nth-child(2),
            tbody td:nth-child(2) {
                display: none;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            header h1 {
                font-size: 1.6rem;
            }

            header p {
                font-size: 0.85rem;
            }

            .top-actions {
                justify-content: center;
            }

            .top-actions button {
                padding: 8px 12px;
                font-size: 0.8rem;
            }

            .input-card {
                padding: 12px;
                border-radius: 12px;
            }

            .table-card {
                border-radius: 12px;
            }

            thead th {
                padding: 10px 12px;
                font-size: 0.7rem;
            }

            tbody td {
                padding: 10px 12px;
            }

            .label-col {
                width: 90px;
            }

            .label-badge {
                padding: 4px 8px;
                font-size: 0.65rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 4px;
            }

            .btn {
                padding: 6px 10px;
                font-size: 0.7rem;
                width: 100%;
                justify-content: center;
            }

            .modal {
                width: 95%;
                border-radius: 12px;
            }

            .modal-header {
                padding: 14px 16px;
            }

            .modal-header h2 {
                font-size: 1rem;
            }

            .modal-body {
                padding: 16px;
            }

            .modal-footer {
                padding: 12px 16px;
                flex-direction: column;
            }

            .modal-footer button {
                width: 100%;
            }

            .toast {
                left: 10px;
                right: 10px;
                bottom: 10px;
                font-size: 0.8rem;
                padding: 10px 16px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-card, .table-card {
            animation: fadeIn 0.6s ease-out;
        }

        /* Tags/Tabs */
        .tags-section {
            margin-bottom: 16px;
        }

        .tags-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .tags-header h3 {
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .manage-tags-btn {
            padding: 6px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .manage-tags-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.03);
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .tab.active {
            background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
            color: white;
            border-color: transparent;
        }

        .tab .count {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 0.7rem;
        }

        /* Tag badge in table */
        .tag-badge {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(123, 47, 247, 0.3);
            color: #c4b5fd;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-left: 8px;
        }

        /* Manage Tags Modal */
        .tag-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .tag-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .tag-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tag-item-name {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .tag-item-count {
            color: #64748b;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        .tag-item-actions {
            display: flex;
            gap: 6px;
        }

        .tag-item-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s ease;
        }

        .tag-item-btn.show {
            background: rgba(100, 116, 139, 0.2);
            color: #94a3b8;
        }

        .tag-item-btn.show:hover {
            background: rgba(100, 116, 139, 0.4);
        }

        .tag-item-btn.show.active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .tag-item-btn.show.active:hover {
            background: rgba(34, 197, 94, 0.4);
        }

        .tag-item-btn.delete {
            background: rgba(244, 63, 94, 0.2);
            color: #f43f5e;
        }

        .tag-item-btn.delete:hover {
            background: rgba(244, 63, 94, 0.4);
        }

        .new-tag-input {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .new-tag-input input {
            flex: 1;
        }

        .new-tag-input button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #7b2ff7 0%, #f107a3 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .new-tag-input button:hover {
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .footer a:hover {
            color: #c084fc;
            text-decoration: underline;
        }

        .footer .heart {
            color: #ef4444;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 <span class="text">Copy-Paste App</span></h1>
            <p>Store and quickly copy your text snippets</p>
        </header>

        <div class="top-actions">
            <button onclick="exportData()">📥 Export</button>
            <button onclick="document.getElementById('importFile').click()">📤 Import</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>

        <div class="input-card">
            <div class="input-group">
                <input type="text" id="labelInput" placeholder="Label">
                <select id="tagInput">
                    <option value="">No Tag</option>
                </select>
                <textarea id="contentInput" placeholder="Enter your content here..." rows="2"></textarea>
            </div>
            <button class="add-btn" onclick="addItem()">➕ Add Content</button>
        </div>

        <!-- Tags/Tabs Section -->
        <div class="tags-section">
            <div class="tags-header">
                <h3>🏷️ Filter by Tag</h3>
                <button class="manage-tags-btn" onclick="openTagsModal()">⚙️ Manage Tags</button>
            </div>
            <div class="tabs-container" id="tabsContainer">
                <!-- Active filter tabs generated by JS -->
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th class="label-col">Label</th>
                        <th class="content-col">Content</th>
                        <th class="actions-col">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div id="emptyState" class="empty-state">
                <div class="icon">📝</div>
                <p>No items yet. Add your first snippet above!</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            Made with <span class="heart">❤️</span> by <a href="https://sdet-karan.netlify.app/" target="_blank" rel="noopener noreferrer">Karan</a>
        </footer>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>✏️ Edit Item</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label>Label</label>
                <input type="text" id="editLabel">
                <label>Tag</label>
                <select id="editTag">
                    <option value="">No Tag</option>
                </select>
                <label>Content</label>
                <textarea id="editContent" rows="4"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Manage Tags Modal -->
    <div id="tagsModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>🏷️ Manage Tags</h2>
                <button class="modal-close" onclick="closeTagsModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 12px;">👁️ Click "Visible/Hidden" to show or hide tags in the filter</p>
                <div class="new-tag-input">
                    <input type="text" id="newTagInput" placeholder="Enter new tag name...">
                    <button onclick="addTag()">Add</button>
                </div>
                <div class="tag-list" id="tagList">
                    <!-- Tags listed here -->
                </div>
                <div id="untaggedOption" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <!-- Untagged option rendered by JS -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeTagsModal()">Close</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const STORAGE_KEY = 'copyPasteItems';
        const TAGS_KEY = 'copyPasteTags';
        const SELECTED_TAGS_KEY = 'copyPasteSelectedTags';
        let items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let tags = JSON.parse(localStorage.getItem(TAGS_KEY)) || [];
        let selectedTags = JSON.parse(localStorage.getItem(SELECTED_TAGS_KEY)) || []; // Array of selected tag names
        let activeFilterTag = '__all__'; // Currently active filter tab: '__all__', tag name, or '__untagged__'
        let editingId = null;
        let draggedIndex = null;

        // Initialize selected tags - if empty, select all by default
        function initSelectedTags() {
            if (selectedTags.length === 0 && tags.length > 0) {
                selectedTags = [...tags, '__untagged__'];
                saveSelectedTags();
            }
            // Clean up selected tags that no longer exist
            selectedTags = selectedTags.filter(t => t === '__untagged__' || tags.includes(t));
            saveSelectedTags();
        }

        // Save selected tags to localStorage
        function saveSelectedTags() {
            localStorage.setItem(SELECTED_TAGS_KEY, JSON.stringify(selectedTags));
        }

        // Save tags to localStorage
        function saveTags() {
            localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
        }

        // Populate tag dropdowns
        function populateTagDropdowns() {
            const tagInput = document.getElementById('tagInput');
            const editTag = document.getElementById('editTag');
            
            const options = '<option value="">No Tag</option>' + 
                tags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
            
            tagInput.innerHTML = options;
            editTag.innerHTML = options;
        }

        // Render active filter tabs (only checked tags from Manage Tags)
        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            
            // Count items per tag
            const tagCounts = {};
            tags.forEach(t => tagCounts[t] = 0);
            items.forEach(item => {
                if (item.tag && tagCounts.hasOwnProperty(item.tag)) {
                    tagCounts[item.tag]++;
                }
            });
            
            // Untagged count
            const untaggedCount = items.filter(i => !i.tag).length;
            
            // Total count of items in selected tags
            let totalCount = 0;
            selectedTags.forEach(tag => {
                if (tag === '__untagged__') {
                    totalCount += untaggedCount;
                } else if (tagCounts[tag] !== undefined) {
                    totalCount += tagCounts[tag];
                }
            });
            
            let html = '';
            
            if (selectedTags.length === 0) {
                html = '<span style="color: #64748b; font-size: 0.85rem;">No tags selected. Go to Manage Tags to enable filters.</span>';
            } else {
                // Add "All" tab if more than 1 tag is selected
                if (selectedTags.length > 1) {
                    html += `<div class="tab ${activeFilterTag === '__all__' ? 'active' : ''}" onclick="setActiveFilterTag('__all__')">
                        All <span class="count">${totalCount}</span>
                    </div>`;
                }
                
                // Show tabs for selected/checked tags
                selectedTags.forEach(tag => {
                    if (tag === '__untagged__') {
                        html += `<div class="tab ${activeFilterTag === '__untagged__' ? 'active' : ''}" onclick="setActiveFilterTag('__untagged__')">
                            Untagged <span class="count">${untaggedCount}</span>
                        </div>`;
                    } else if (tags.includes(tag)) {
                        html += `<div class="tab ${activeFilterTag === tag ? 'active' : ''}" onclick="setActiveFilterTag('${escapeHtml(tag)}')">
                            ${escapeHtml(tag)} <span class="count">${tagCounts[tag]}</span>
                        </div>`;
                    }
                });
            }
            
            container.innerHTML = html;
        }

        // Set active filter tag
        function setActiveFilterTag(tag) {
            activeFilterTag = tag;
            renderTabs();
            render();
        }

        // Get filtered items based on selected checkboxes and active tab
        function getFilteredItems() {
            // If no tags selected, show nothing
            if (selectedTags.length === 0) return [];
            
            // If "All" is selected, show all items from selected tags
            if (activeFilterTag === '__all__') {
                return items.filter(item => {
                    if (!item.tag) {
                        return selectedTags.includes('__untagged__');
                    }
                    return selectedTags.includes(item.tag);
                });
            }
            
            // Filter by specific tag
            if (activeFilterTag === '__untagged__') {
                return items.filter(i => !i.tag);
            }
            
            return items.filter(i => i.tag === activeFilterTag);
        }

        // Drag and Drop handlers
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('tbody tr').forEach(tr => {
                tr.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            
            const targetIndex = parseInt(this.dataset.index);
            
            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                // Reorder items array
                const draggedItem = items[draggedIndex];
                items.splice(draggedIndex, 1);
                items.splice(targetIndex, 0, draggedItem);
                
                save();
                render();
                showToast('Order updated!');
            }
            
            draggedIndex = null;
        }

        // Render table
        function render() {
            const tbody = document.getElementById('tableBody');
            const empty = document.getElementById('emptyState');
            const filteredItems = getFilteredItems();
            
            tbody.innerHTML = '';
            
            if (filteredItems.length === 0) {
                empty.style.display = 'block';
                empty.querySelector('p').textContent = activeTag ? 'No items with this tag.' : 'No items yet. Add your first snippet above!';
                return;
            }
            
            empty.style.display = 'none';
            
            filteredItems.forEach((item, index) => {
                const originalIndex = items.indexOf(item);
                const tr = document.createElement('tr');
                tr.draggable = true;
                tr.dataset.index = originalIndex;
                const tagHtml = item.tag ? `<span class="tag-badge">${escapeHtml(item.tag)}</span>` : '';
                tr.innerHTML = `
                    <td class="label-col">
                        <span class="label-badge">${escapeHtml(item.label)}</span>${tagHtml}
                    </td>
                    <td class="content-col">
                        <div class="content-text">${escapeHtml(item.content)}</div>
                    </td>
                    <td class="actions-col">
                        <div class="action-buttons">
                            <button class="btn btn-copy" onclick="copyItem('${item.id}')">📋 Copy</button>
                            <button class="btn btn-edit" onclick="editItem('${item.id}')">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="deleteItem('${item.id}')">🗑️ Delete</button>
                        </div>
                    </td>
                `;
                
                // Drag events
                tr.addEventListener('dragstart', handleDragStart);
                tr.addEventListener('dragend', handleDragEnd);
                tr.addEventListener('dragover', handleDragOver);
                tr.addEventListener('dragenter', handleDragEnter);
                tr.addEventListener('dragleave', handleDragLeave);
                tr.addEventListener('drop', handleDrop);
                
                tbody.appendChild(tr);
            });
            
            renderTabs();
        }

        // Escape HTML
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Save to localStorage
        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        // Check for duplicate labels
        function checkDuplicateLabel(label, tag, excludeId = null) {
            const normalizedLabel = label.toLowerCase();
            const normalizedTag = tag || null;
            
            // Check if same label exists in same tag
            const sameTagDuplicate = items.find(i => 
                i.label.toLowerCase() === normalizedLabel && 
                i.tag === normalizedTag &&
                i.id !== excludeId
            );
            
            if (sameTagDuplicate) {
                return { type: 'error', message: `Label "${label}" already exists in ${tag || 'Untagged'} group!` };
            }
            
            // Check if same label exists in other tags
            const otherTagItems = items.filter(i => 
                i.label.toLowerCase() === normalizedLabel && 
                i.tag !== normalizedTag &&
                i.id !== excludeId
            );
            
            if (otherTagItems.length > 0) {
                const otherTags = [...new Set(otherTagItems.map(i => i.tag || 'Untagged'))];
                return { type: 'warning', message: `Label "${label}" also exists in: ${otherTags.join(', ')}` };
            }
            
            return null;
        }

        // Add new item
        function addItem() {
            const label = document.getElementById('labelInput').value.trim();
            const content = document.getElementById('contentInput').value.trim();
            const tag = document.getElementById('tagInput').value;
            
            if (!label) {
                showToast('Please enter a label!', 'error');
                return;
            }
            if (!content) {
                showToast('Please enter content!', 'error');
                return;
            }
            
            // Check for duplicate labels
            const duplicateCheck = checkDuplicateLabel(label, tag || null);
            if (duplicateCheck) {
                if (duplicateCheck.type === 'error') {
                    showToast(duplicateCheck.message, 'error');
                    return;
                }
                if (duplicateCheck.type === 'warning') {
                    showToast(duplicateCheck.message, 'warning');
                    // Continue adding but show warning
                }
            }
            
            items.unshift({
                id: Date.now().toString(),
                label: label,
                content: content,
                tag: tag || null
            });
            
            save();
            render();
            
            document.getElementById('labelInput').value = '';
            document.getElementById('contentInput').value = '';
            document.getElementById('tagInput').value = '';
            
            showToast('Item added successfully!');
        }

        // Copy item
        function copyItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                navigator.clipboard.writeText(item.content).then(() => {
                    showToast('Copied to clipboard!');
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = item.content;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('Copied to clipboard!');
                });
            }
        }

        // Edit item
        function editItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                editingId = id;
                document.getElementById('editLabel').value = item.label;
                document.getElementById('editTag').value = item.tag || '';
                document.getElementById('editContent').value = item.content;
                document.getElementById('editModal').classList.add('show');
            }
        }

        // Save edit
        function saveEdit() {
            const label = document.getElementById('editLabel').value.trim();
            const content = document.getElementById('editContent').value.trim();
            const tag = document.getElementById('editTag').value;
            
            if (!label || !content) {
                showToast('Please fill all fields!', 'error');
                return;
            }
            
            // Check for duplicate labels (exclude current item)
            const duplicateCheck = checkDuplicateLabel(label, tag || null, editingId);
            if (duplicateCheck) {
                if (duplicateCheck.type === 'error') {
                    showToast(duplicateCheck.message, 'error');
                    return;
                }
                if (duplicateCheck.type === 'warning') {
                    showToast(duplicateCheck.message, 'warning');
                    // Continue saving but show warning
                }
            }
            
            const item = items.find(i => i.id === editingId);
            if (item) {
                item.label = label;
                item.content = content;
                item.tag = tag || null;
                save();
                render();
                closeModal();
                showToast('Item updated!');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
            editingId = null;
        }

        // Delete item
        function deleteItem(id) {
            if (confirm('Delete this item?')) {
                items = items.filter(i => i.id !== id);
                save();
                render();
                showToast('Item deleted!');
            }
        }

        // Export data
        function exportData() {
            if (items.length === 0) {
                showToast('No items to export!', 'error');
                return;
            }
            const blob = new Blob([JSON.stringify(items, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'copy-paste-backup.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Exported successfully!');
        }

        // Import data
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        const newItems = imported.filter(imp => 
                            !items.some(i => i.content === imp.content)
                        );
                        
                        // Collect unique tags from imported items
                        const importedTags = [...new Set(newItems.map(i => i.tag).filter(t => t && !tags.includes(t)))];
                        if (importedTags.length > 0) {
                            tags = [...tags, ...importedTags];
                            saveTags();
                            populateTagDropdowns();
                        }
                        
                        items = [...newItems.map(i => ({
                            id: Date.now().toString() + Math.random(),
                            label: i.label || 'Imported',
                            content: i.content,
                            tag: i.tag || null
                        })), ...items];
                        save();
                        render();
                        showToast(`Imported ${newItems.length} items!`);
                    }
                } catch (err) {
                    showToast('Invalid file!', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Show toast
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            
            // Set background color based on type
            if (type === 'error') {
                toast.style.background = '#ef4444';
            } else if (type === 'warning') {
                toast.style.background = '#f59e0b';
            } else {
                toast.style.background = '#10b981';
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), type === 'warning' ? 4000 : 3000);
        }

        // Close modal on escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        // Close modal on backdrop click
        document.getElementById('editModal').addEventListener('click', e => {
            if (e.target.classList.contains('modal-overlay')) closeModal();
        });

        document.getElementById('tagsModal').addEventListener('click', e => {
            if (e.target.classList.contains('modal-overlay')) closeTagsModal();
        });

        // Tags Modal Functions
        function openTagsModal() {
            renderTagList();
            document.getElementById('tagsModal').classList.add('show');
        }

        function closeTagsModal() {
            document.getElementById('tagsModal').classList.remove('show');
            document.getElementById('newTagInput').value = '';
        }

        function renderTagList() {
            const container = document.getElementById('tagList');
            const untaggedContainer = document.getElementById('untaggedOption');
            
            // Count items per tag
            const tagCounts = {};
            tags.forEach(t => tagCounts[t] = 0);
            items.forEach(item => {
                if (item.tag && tagCounts.hasOwnProperty(item.tag)) {
                    tagCounts[item.tag]++;
                }
            });
            
            // Untagged count
            const untaggedCount = items.filter(i => !i.tag).length;
            
            if (tags.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px;">No tags created yet.</p>';
            } else {
                container.innerHTML = tags.map(tag => {
                    const isChecked = selectedTags.includes(tag);
                    return `
                    <div class="tag-item">
                        <div class="tag-item-left">
                            <span class="tag-item-name">${escapeHtml(tag)}</span>
                            <span class="tag-item-count">${tagCounts[tag]} items</span>
                        </div>
                        <div class="tag-item-actions">
                            <button class="tag-item-btn ${isChecked ? 'show active' : 'show'}" onclick="toggleTagFilter('${escapeHtml(tag)}')">
                                ${isChecked ? '👁️ Visible' : '👁️‍🗨️ Hidden'}
                            </button>
                            <button class="tag-item-btn delete" onclick="deleteTag('${escapeHtml(tag)}')">🗑️ Delete</button>
                        </div>
                    </div>
                `}).join('');
            }
            
            // Render Untagged option
            const isUntaggedChecked = selectedTags.includes('__untagged__');
            untaggedContainer.innerHTML = `
                <div class="tag-item">
                    <div class="tag-item-left">
                        <span class="tag-item-name">Untagged</span>
                        <span class="tag-item-count">${untaggedCount} items</span>
                    </div>
                    <div class="tag-item-actions">
                        <button class="tag-item-btn ${isUntaggedChecked ? 'show active' : 'show'}" onclick="toggleTagFilter('__untagged__')">
                            ${isUntaggedChecked ? '👁️ Visible' : '👁️‍🗨️ Hidden'}
                        </button>
                    </div>
                </div>
            `;
        }

        // Toggle tag visibility in filter
        function toggleTagFilter(tag) {
            const index = selectedTags.indexOf(tag);
            if (index > -1) {
                selectedTags.splice(index, 1);
                // If current filter was this tag, switch to 'All'
                if (activeFilterTag === tag) {
                    activeFilterTag = '__all__';
                }
            } else {
                selectedTags.push(tag);
            }
            saveSelectedTags();
            renderTagList(); // Update buttons in modal
            renderTabs();
            render();
        }

        function addTag() {
            const input = document.getElementById('newTagInput');
            const tagName = input.value.trim();
            
            if (!tagName) {
                showToast('Please enter a tag name!', 'error');
                return;
            }
            
            if (tags.includes(tagName)) {
                showToast('Tag already exists!', 'error');
                return;
            }
            
            tags.push(tagName);
            // Auto-select the new tag
            if (!selectedTags.includes(tagName)) {
                selectedTags.push(tagName);
                saveSelectedTags();
            }
            saveTags();
            populateTagDropdowns();
            renderTagList();
            renderTabs();
            input.value = '';
            showToast('Tag created!');
        }

        function deleteTag(tagName) {
            if (!confirm(`Delete tag "${tagName}"? Items with this tag will become untagged.`)) return;
            
            // Remove tag from items
            items.forEach(item => {
                if (item.tag === tagName) {
                    item.tag = null;
                }
            });
            save();
            
            // Remove tag from tags list
            tags = tags.filter(t => t !== tagName);
            saveTags();
            
            // Reset active tag if deleted
            if (activeTag === tagName) {
                activeTag = null;
            }
            
            populateTagDropdowns();
            renderTagList();
            render();
            showToast('Tag deleted!');
        }

        // Handle Enter key in new tag input
        document.getElementById('newTagInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') addTag();
        });

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // Initial setup
        initSelectedTags();
        populateTagDropdowns();
        renderTabs();
        render();
    </script>
</body>
</html>
